name: 'Tauri Hybrid Build (Local & Cloud)'

on:
  push:
    branches:
      - main

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 在你的 Ubuntu 主机上跑 (Linux & Windows) ---
          - platform: 'self-hosted'
            target: 'x86_64-unknown-linux-gnu'
            os_tag: 'linux-x64'
          - platform: 'self-hosted'
            target: 'x86_64-pc-windows-gnu'
            os_tag: 'windows-x64'
          
          # --- 在 GitHub 官方托管环境跑 (macOS) ---
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            os_tag: 'macos-arm64'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: |
          corepack enable
          pnpm install

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 只有在本地 Ubuntu 跑 Linux 编译时，才需要确保系统依赖（虽然你手动装过了，这里保留作为双重保障）
      - name: install system dependencies (linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.platform != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.os_tag }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: warn
